name: Scheduled Collect

# HoloGlish の字幕を収集し、生成した索引(DB)を専用ブランチ `hologlish-data`
# に蓄積する。main の作業ツリーは汚さない。
#
# 字幕取得は Supadata サービス経路（--subs-source service）が既定。
# IPブロックに依存しないためクラウドの定期スケジュールで完全自動化できる
# （Secret SUPADATA_API_KEY が必要。有料プラン契約済み）。
# yt-dlp / youtube-transcript-api 経路は GitHub のクラウドIPが YouTube に
# ブロックされるため使えない（住宅IPでの手動実行時のみ有効）。

on:
  # Supadata サービス経路で 6 時間ごとに自動収集する。
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "対象ブランチ (jp/en/id)。空なら全ブランチ"
        required: false
        default: ""
      members:
        description: "カンマ区切りのメンバー名で絞り込み（任意）"
        required: false
        default: ""
      limit:
        description: "1実行でチャンネル別に新規処理する本数の上限（既定30。繰り返しで奥へ前進）"
        required: false
        default: "30"
      list_depth:
        description: "列挙する本数（新しい順）。0で全件＝過去アーカイブへ到達（既定0）"
        required: false
        default: "0"
      sleep:
        description: "動画間の待機秒（レート制限対策）。cookies併用のため既定1.5"
        required: false
        default: "1.5"
      time_budget:
        description: "収集の時間予算（秒）。空なら自動（ジョブ上限から前後処理の実測時間を引いて逆算）"
        required: false
        default: ""
      subs_source:
        description: "字幕取得経路 service/ytdlp/api/both（既定service=Supadata。IPブロック非依存）"
        required: false
        default: "service"
      player_clients:
        description: "yt-dlp の innertube クライアント（カンマ区切り）。default で既定。bot判定回避用"
        required: false
        default: ""

# 索引を hologlish-data ブランチへ push するために書き込み権限が必要
permissions:
  contents: write

concurrency:
  group: hologlish-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 全アーカイブ収集は長時間になりうるが、再開可能なので途中で切れても次回続行
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # 収集予算の動的計算に使う基準時刻（ジョブ開始からの経過を測る）
      - name: Mark job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore accumulated index
        run: |
          mkdir -p data
          if git fetch origin hologlish-data:hologlish-data 2>/dev/null; then
            bash .github/scripts/db_restore.sh hologlish-data data/hologlish.db \
              && echo "既存の索引を復元しました" \
              || echo "索引ファイルが見つからないため新規作成します"
          else
            echo "hologlish-data ブランチが無いため新規作成します"
          fi

      - name: Prepare cookies (optional)
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            echo "HOLOGLISH_COOKIES=$RUNNER_TEMP/cookies.txt" >> "$GITHUB_ENV"
            echo "cookies を設定しました"
          else
            echo "cookies 未設定（bot 判定リスクあり）のまま続行します"
          fi

      # 【早期公開】収集の前に、各チャンネルの全動画を軽量列挙して台帳(母集合)を
      # 最新化し、収集状況 coverage.json を先に公開する。これにより長い収集の完了を
      # 待たずに、スプレッドシートへ「未収集」を含む一覧が数分〜十数分で反映される。
      - name: Refresh catalog (collection coverage)
        env:
          BRANCH: ${{ inputs.branch }}
          MEMBERS: ${{ inputs.members }}
        run: |
          python -m pipeline.run catalog \
            ${BRANCH:+--branch "$BRANCH"} \
            ${MEMBERS:+--members "$MEMBERS"} \
            --sleep 1 --retries 3 --retry-base 5 || echo "catalog 更新をスキップ（続行）"

      - name: Build coverage.json (early)
        if: always()
        run: |
          python -m pipeline.run coverage --out data/coverage.json || echo "coverage 生成をスキップ（続行）"

      - name: Publish coverage early
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # 所要時間を記録する: 最終公開もほぼ同じ作業なので、収集予算の計算で
        # 「最終公開にどれだけ残すべきか」の実測値として使う。
        run: |
          T0=$(date +%s)
          bash .github/scripts/publish_data.sh
          echo "EARLY_PUBLISH_SECS=$(( $(date +%s) - T0 ))" >> "$GITHUB_ENV"

      - name: Collect subtitles
        env:
          # 1実行あたり各チャンネル最大 LIMIT 本（既定30）。再開可能で繰り返し積み上げる。
          BRANCH: ${{ inputs.branch }}
          MEMBERS: ${{ inputs.members }}
          LIMIT: ${{ inputs.limit || '30' }}
          # 列挙は全件(0)。処理量は LIMIT・時間予算で制御し、繰り返し実行で
          # 過去アーカイブの奥へ前進する（新しい側から順に処理済みをスキップ）。
          LIST_DEPTH: ${{ inputs.list_depth || '0' }}
          SLEEP: ${{ inputs.sleep || '1.5' }}
          # 空（schedule 実行）なら下の run で動的に計算する。固定値は索引の成長で
          # 前後処理が伸びると再び上限超過を起こすため、手動実行の明示指定専用。
          TIME_BUDGET: ${{ inputs.time_budget }}
          # 字幕取得経路。service=有償の字幕取得サービス（Supadata。IPブロック非依存で
          # クラウド自動化に最適。Secret SUPADATA_API_KEY が必要）。schedule 実行時は
          # inputs が空のためこのフォールバック（service）が使われる。
          SUBS_SOURCE: ${{ inputs.subs_source || 'service' }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # yt-dlp の innertube クライアント切替（bot判定回避）。空なら pipeline 既定。
          HOLOGLISH_PLAYER_CLIENTS: ${{ inputs.player_clients }}
        run: |
          # 予算が未指定なら、ジョブ上限(350分=21000秒)から「ここまでの実測経過時間」と
          # 「最終公開の予約（早期公開の実測×1.25+10分。作業内容がほぼ同じため）」を
          # 引いた残りを使う。復元・カタログ・公開は索引の成長で毎月伸びるので、
          # 固定予算では最終公開がジョブ上限に食い込み収集分を失う
          # （2026-09-28 Run#149 で5時間分、2026-10-28 Run#262 で4時間分を喪失）。
          # クレジットが実質の上限なので、予算が縮んでも月間の収集総量は変わらない。
          if [ -z "$TIME_BUDGET" ]; then
            ELAPSED=$(( $(date +%s) - ${JOB_START:-$(date +%s)} ))
            EARLY=${EARLY_PUBLISH_SECS:-2400}
            RESERVE=$(( EARLY + EARLY / 4 + 600 ))
            TIME_BUDGET=$(( 21000 - ELAPSED - RESERVE ))
            [ "$TIME_BUDGET" -gt 14400 ] && TIME_BUDGET=14400
            [ "$TIME_BUDGET" -lt 600 ] && TIME_BUDGET=600
            echo "収集予算を動的設定: ${TIME_BUDGET}秒（経過 ${ELAPSED}秒 / 公開予約 ${RESERVE}秒）"
          fi
          python -m pipeline.run collect \
            ${BRANCH:+--branch "$BRANCH"} \
            ${MEMBERS:+--members "$MEMBERS"} \
            --limit "$LIMIT" --list-depth "$LIST_DEPTH" --time-budget "$TIME_BUDGET" \
            --subs-source "$SUBS_SOURCE" \
            --sleep "$SLEEP" --retries 4 --retry-base 5

      # 収集分を反映して coverage.json を作り直す
      - name: Rebuild coverage.json
        if: always()
        run: |
          python -m pipeline.run coverage --out data/coverage.json || echo "coverage 生成をスキップ（続行）"

      # 収集ステップが途中で失敗しても、それまでの索引・収集状況は公開する（データ保全）
      - name: Publish index to hologlish-data branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_data.sh
